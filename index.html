<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEMSCON trial builds</title>
  <style>
    :root { --ink: #0b1733; --muted: #5b6a86; --blue: #0d63d8; --line: #e2eaf6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: system-ui, sans-serif; color: var(--ink); background: #f4f8fe; }
    main { width: min(640px, 100%); }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { display: block; padding: 18px 20px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { border-color: var(--blue); outline: none; }
    strong { display: block; color: var(--blue); font-size: 18px; margin-bottom: 4px; }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>IEEE TEMS homepage: trial builds</h1>
    <p>Unofficial, standalone trial. Not affiliated with or endorsed by IEEE or IEEE TEMS.</p>
    <a href="bento/"><strong>Bento version</strong><small>Merged bento grid, polished for accessibility and contrast</small></a>
    <a href="classic/"><strong>Classic version</strong><small>Stats bar, six-card Explore grid and separate history tile</small></a>
  </main>
</body>
</html>
